name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The macOS leg is load-bearing: it runs the real BSD awk and /bin/sh the
  # plugin targets; ubuntu covers dash + gawk. Together they ARE the
  # portability test for the frontmatter dialect.
  test:
    name: sh tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: run test suite
        run: sh test/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/zavet hooks/scripts/*.sh test/*.sh scripts/*.sh

  # The portable Agent Skills under .agents/skills/ are GENERATED from
  # commands/*.md and skills/zavet/SKILL.md. Editing a command without
  # regenerating leaves two copies of the same workflow that teach different
  # things — and nothing about either file looks wrong, which is exactly why
  # this has to be a build failure rather than a review habit.
  adapters-sync:
    name: generated skills match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .agents/skills is up to date
        run: sh scripts/gen-adapters.sh --check

  fixture-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vendored fixtures match MANIFEST
        run: sh test/sync-check.sh
      # Targets dirahq-cli's `develop`, not `main` — on purpose, not by
      # mistake. zavet has one release channel (`main`, see CONTRIBUTING.md),
      # so whatever lands here next ships to every user as soon as it's
      # merged. Pinning the comparison to dira's `main` would only catch
      # drift a release late: dira's dialect changes land on `develop` first
      # and reach `main` only when dira itself cuts a release, by which time
      # a zavet change built against the stale `main` copy would already be
      # wrong. Comparing against `develop` catches drift against the dialect
      # the *next* dira ships, which is the one that matters here.
      # dirahq-cli is public as of 2026-07-28, so the anonymous fetch always
      # succeeds and both a fetch failure and a diff are now hard failures.
      # This used to warn-and-skip when the copy could not be read, because a
      # 404 against a private repo was an access problem rather than evidence
      # of drift — and a job that fails for reasons nobody can act on is a job
      # everybody learns to ignore. That reasoning is spent: an unreachable
      # canonical copy is now itself a real signal (the path moved, the branch
      # was renamed, the repo went private again), so it should stop the build
      # rather than print a warning nobody reads.
      #
      # Fetched over raw.githubusercontent.com rather than the contents API,
      # because the API path did exactly what the note here used to only
      # anticipate: it started returning 403 on a URL that fetches fine
      # anonymously from anywhere else. Unauthenticated API calls are limited
      # to 60/hr per IP, shared across the runner's egress, so a neighbour's
      # traffic failed this job. raw has no such quota and needs no token, and
      # it keeps a failure meaning what this job wants it to mean — the path
      # moved, the branch was renamed, the repo went private again — instead of
      # "someone else on this runner used up the quota". It is CDN-cached for
      # about five minutes, which is nothing against drift measured in releases.
      - name: canonical MANIFEST in dirahq-cli matches
        env:
          CANONICAL_URL: https://raw.githubusercontent.com/dodi-smart/dirahq-cli/develop/cli/core/testdata/zavet-dialect/MANIFEST
        run: |
          set -eu
          out="$RUNNER_TEMP/canonical-manifest"
          curl -fsSL "$CANONICAL_URL" -o "$out"
          echo "canonical MANIFEST fetched; diffing"
          diff -u "$out" test/fixtures/dialect/MANIFEST

  # --- Decision: no `claude plugin validate` job here -----------------------
  # Running the real `claude plugin validate . --strict` in CI would mean
  # installing (and, for a meaningful run, authenticating) the `claude` CLI
  # on every runner, for every push and PR, just to catch the two things that
  # actually go wrong in practice: a manifest that doesn't parse, and
  # `plugin.json`'s version drifting from the tag `claude plugin tag` cuts at
  # release time. That's a lot of pipeline weight (and a new external
  # dependency, credentials included) for what `manifest-check` below covers
  # for the price of `jq`. Full `--strict` validation stays a local,
  # pre-tag check (see CONTRIBUTING.md) — cheap to run by hand, not worth
  # running on every commit.
  manifest-check:
    name: plugin manifest sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags for the version check below
      - name: manifests parse as JSON
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
      - name: plugin.json version matches the latest v* tag reachable from HEAD (if any)
        run: |
          tag=$(git tag --list 'v*' --merged HEAD | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo "no v* tag reachable from HEAD yet (pre-first-release) — skipping"
            exit 0
          fi
          tag_version=${tag#v}
          manifest_version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "plugin.json version ($manifest_version) does not match latest tag $tag ($tag_version)" >&2
            exit 1
          fi
          echo "plugin.json version $manifest_version matches $tag"
